<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sirup Calc">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <title>Sirup Umrechner & Vorlagen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --danger: #ef4444;
            --input-bg: #0f172a;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 12px;
            min-height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-height: 65px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 6px;
            text-align: center;
            color: var(--primary);
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .preset-section {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .preset-row {
            display: flex;
            gap: 8px;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .btn-holy-quick {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-holy-quick:active {
            background-color: var(--primary);
            color: #000;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input.has-prefix {
            padding-left: 42px;
        }

        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background-color: var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: inline-block;
        }

        .file-name {
            font-size: 12px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .save-preset-box {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .results {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .result-card {
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-card.highlight {
            border: 1px solid var(--primary);
            background: rgba(245, 158, 11, 0.08);
        }

        .result-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .result-value {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .result-value.primary { color: var(--primary); }
        .result-value.accent { color: var(--accent-blue); }

        .warning {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--danger);
            display: none;
        }

        .info-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container" id="logoContainer"></div>

    <h1>Sirup Umrechner</h1>
    <p class="subtitle">Mischungsverhältnisse anpassen & speichern</p>

    <div class="preset-section">
        <label style="margin-bottom: 6px;">Vorlage auswählen</label>
        <div class="preset-row">
            <select id="presetSelect" onchange="loadSelectedPreset()"></select>
            <button class="btn btn-danger" id="deletePresetBtn" onclick="deleteCurrentPreset()" style="display: none;" title="Vorlage löschen">✕</button>
        </div>
        
        <div style="margin-top: 10px;">
            <button class="btn btn-secondary" style="width: 100%;" onclick="toggleSaveBox()">+ Neue Vorlage</button>
        </div>

        <div class="save-preset-box" id="savePresetBox">
            <div class="form-group">
                <div class="label-header">
                    <label for="newPresetName">Name der Vorlage</label>
                    <button type="button" class="btn btn-danger" onclick="toggleSaveBox()" style="padding: 2px 8px; font-size: 11px;" title="Schließen">✕</button>
                </div>
                <input type="text" id="newPresetName" placeholder="z. B. SodaStream Flasche">
            </div>
            
            <div class="form-group">
                <label style="margin-bottom: 6px;">Logo hinzufügen (optional)</label>
                <div class="file-input-wrapper">
                    <label for="logoFileInput" class="file-label">Bild wählen</label>
                    <input type="file" id="logoFileInput" accept="image/*" onchange="handleLogoSelect(event)">
                    <span class="file-name" id="fileNameDisplay">Kein Bild gewählt</span>
                </div>
            </div>

            <button class="btn" style="width: 100%;" onclick="saveAsPreset()">Vorlage speichern</button>
        </div>
    </div>

    <div class="form-group">
        <label for="origRatio" style="margin-bottom: 6px;">Hersteller-Verhältnis (1 : X)</label>
        <div class="input-wrapper">
            <span class="input-prefix">1 :</span>
            <input type="number" id="origRatio" class="has-prefix" value="140" min="1" step="1">
        </div>
    </div>

    <div class="form-group">
        <div class="label-header">
            <label for="targetRatio">Ziel-Verhältnis (1 : X)</label>
            <button type="button" class="btn-holy-quick" onclick="resetToHoly()">Holy Syrup (Standard)</button>
        </div>
        <div class="input-wrapper">
            <span class="input-prefix">1 :</span>
            <input type="number" id="targetRatio" class="has-prefix" value="24" min="1" step="1">
        </div>
    </div>

    <div class="form-group">
        <label for="cartridgeVolume" style="margin-bottom: 6px;">Kartuschen / Behälter-Volumen (ml)</label>
        <input type="number" id="cartridgeVolume" value="85" min="1" step="1">
    </div>

    <!-- NEUES OPTIONALES FELD -->
    <div class="form-group">
        <label for="availableSyrup" style="margin-bottom: 2px;">Verfügbarer Sirup (ml) - optional</label>
        <input type="number" id="availableSyrup" placeholder="z. B. 12 (leer lassen für volles Rezept)" min="0" step="0.1">
        <div class="info-text">Falls nur noch ein Rest in der Flasche ist</div>
    </div>

    <div id="warningBox" class="warning">
        Der Quellsirup ist schwächer als das Ziel-Verhältnis und kann nicht weiter verdünnt werden!
    </div>

    <div class="results" id="resultsBox">
        <div class="result-card highlight">
            <div class="result-label" id="syrupLabel">Sirup einfüllen</div>
            <div class="result-value primary" id="syrupResult">0 ml</div>
        </div>

        <div class="result-card">
            <div class="result-label">Wasser auffüllen</div>
            <div class="result-value accent" id="waterResult">0 ml</div>
        </div>

        <div class="result-card">
            <div class="result-label">Ergibt Fertiggetränk</div>
            <div class="result-value" id="totalDrinkResult">0 Liter</div>
        </div>
    </div>
</div>

<script>
    const DEFAULT_PRESETS = [
        { 
            id: 'PfannerZeroSirup', 
            name: 'Pfanner Zero Sirup', 
            origRatio: 140,
            targetRatio: 24, 
            volume: 85, 
            logo: 'assets/Pfanner_Zero_Sirup.png' 
        },
        { 
            id: 'MoreZerup', 
            name: 'More Zerup', 
            origRatio: 154,
            targetRatio: 24, 
            volume: 85, 
            logo: 'assets/More_Zerup.png' 
        }
    ];

    let customPresets = JSON.parse(localStorage.getItem('custom_syrup_presets')) || [];
    let presets = [...DEFAULT_PRESETS, ...customPresets];
    let tempLogoBase64 = '';

    function init() {
        renderPresetDropdown();
        loadSelectedPreset();

        document.getElementById('origRatio').addEventListener('input', calculate);
        document.getElementById('targetRatio').addEventListener('input', calculate);
        document.getElementById('cartridgeVolume').addEventListener('input', calculate);
        document.getElementById('availableSyrup').addEventListener('input', calculate);
    }

    function renderPresetDropdown() {
        const select = document.getElementById('presetSelect');
        select.innerHTML = '';
        
        presets.forEach(preset => {
            const option = document.createElement('option');
            option.value = preset.id;
            option.textContent = preset.name;
            select.appendChild(option);
        });
    }

    function loadSelectedPreset() {
        const select = document.getElementById('presetSelect');
        const selectedId = select.value;
        const preset = presets.find(p => p.id === selectedId);

        if (preset) {
            document.getElementById('origRatio').value = preset.origRatio || 140;
            document.getElementById('targetRatio').value = preset.targetRatio;
            document.getElementById('cartridgeVolume').value = preset.volume;
            
            const logoContainer = document.getElementById('logoContainer');
            if (preset.logo) {
                logoContainer.innerHTML = `<img src="${preset.logo}" class="logo-img" alt="Logo">`;
            } else {
                logoContainer.innerHTML = '';
            }

            const deleteBtn = document.getElementById('deletePresetBtn');
            const isCustom = customPresets.some(p => p.id === selectedId);
            deleteBtn.style.display = isCustom ? 'block' : 'none';

            calculate();
        }
    }

    function deleteCurrentPreset() {
        const select = document.getElementById('presetSelect');
        const selectedId = select.value;

        const isCustom = customPresets.some(p => p.id === selectedId);
        if (!isCustom) return;

        if (confirm('Möchtest du diese eigene Vorlage wirklich löschen?')) {
            customPresets = customPresets.filter(p => p.id !== selectedId);
            localStorage.setItem('custom_syrup_presets', JSON.stringify(customPresets));
            presets = [...DEFAULT_PRESETS, ...customPresets];

            renderPresetDropdown();
            loadSelectedPreset();
        }
    }

    function resetToHoly() {
        document.getElementById('origRatio').value = 140;
        document.getElementById('targetRatio').value = 24;
        document.getElementById('cartridgeVolume').value = 85;
        calculate();
    }

    function toggleSaveBox() {
        const box = document.getElementById('savePresetBox');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function handleLogoSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('fileNameDisplay').textContent = file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 300;
                const MAX_HEIGHT = 150;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                tempLogoBase64 = canvas.toDataURL('image/png');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function saveAsPreset() {
        const nameInput = document.getElementById('newPresetName');
        const name = nameInput.value.trim();

        if (!name) {
            alert('Bitte gib einen Namen für die Vorlage ein.');
            return;
        }

        const newPreset = {
            id: 'preset_' + Date.now(),
            name: name,
            origRatio: parseFloat(document.getElementById('origRatio').value),
            targetRatio: parseFloat(document.getElementById('targetRatio').value),
            volume: parseFloat(document.getElementById('cartridgeVolume').value),
            logo: tempLogoBase64
        };

        try {
            customPresets.push(newPreset);
            localStorage.setItem('custom_syrup_presets', JSON.stringify(customPresets));
            presets = [...DEFAULT_PRESETS, ...customPresets];
        } catch (e) {
            alert('Der Speicherplatz des Browsers ist voll.');
            return;
        }

        renderPresetDropdown();
        document.getElementById('presetSelect').value = newPreset.id;
        
        nameInput.value = '';
        document.getElementById('logoFileInput').value = '';
        document.getElementById('fileNameDisplay').textContent = 'Kein Bild gewählt';
        tempLogoBase64 = '';
        toggleSaveBox();

        loadSelectedPreset();
    }

    function calculate() {
        const origRatio = parseFloat(document.getElementById('origRatio').value);
        const targetRatio = parseFloat(document.getElementById('targetRatio').value);
        const cartridgeVolume = parseFloat(document.getElementById('cartridgeVolume').value);
        const availableSyrupInput = document.getElementById('availableSyrup').value;

        const warningBox = document.getElementById('warningBox');
        const resultsBox = document.getElementById('resultsBox');

        if (!origRatio || !targetRatio || !cartridgeVolume || origRatio <= 0 || targetRatio <= 0 || cartridgeVolume <= 0) {
            return;
        }

        if (origRatio < targetRatio) {
            warningBox.style.display = 'block';
            resultsBox.style.display = 'none';
            return;
        }

        warningBox.style.display = 'none';
        resultsBox.style.display = 'block';

        // Berechne ideal benötigten Sirup
        const standardTotalDrinkMl = cartridgeVolume * targetRatio;
        const idealSyrupMl = standardTotalDrinkMl / origRatio;

        let actualSyrupMl = idealSyrupMl;
        let isRest = false;

        // Falls ein Rest-Wert eingetragen ist und dieser kleiner als das Ideal ist
        if (availableSyrupInput !== '' && !isNaN(parseFloat(availableSyrupInput))) {
            const parsedAvailable = parseFloat(availableSyrupInput);
            if (parsedAvailable >= 0 && parsedAvailable < idealSyrupMl) {
                actualSyrupMl = parsedAvailable;
                isRest = true;
            }
        }

        // Neuberechnung basierend auf dem tatsächlich verfügbaren Sirup
        const actualTotalDrinkMl = actualSyrupMl * origRatio;
        const actualWaterMl = (actualTotalDrinkMl / targetRatio) - actualSyrupMl;

        document.getElementById('syrupLabel').innerText = isRest ? 'Sirup-Rest einfüllen' : 'Sirup einfüllen';
        document.getElementById('syrupResult').innerText = actualSyrupMl.toFixed(2) + ' ml';
        document.getElementById('waterResult').innerText = Math.max(0, actualWaterMl).toFixed(2) + ' ml';
        document.getElementById('totalDrinkResult').innerText = (actualTotalDrinkMl / 1000).toFixed(2) + ' Liter';
    }

    init();
</script>

</body>
</html>
